  <g font-family="Arial, sans-serif" fill="#2b241d">
    <text x="90" y="815" font-size="24" font-weight="700">Practice focus</text>
    <text x="90" y="856" font-size="18">1. Count out loud: 1 - 2 - 3 - 4.</text>
    <text x="90" y="890" font-size="18">2. Keep the bow slow and heavy enough for a clear bass sound.</text>
    <text x="90" y="924" font-size="18">3. Circle D, A, and G before playing.</text>
    <text x="90" y="980" font-size="16" fill="#75695f">For the Star Wars score: place your licensed file at scores/star-wars.pdf and select the Star Wars preset in the web page.</text>
